<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Arranging the Widths</title>
  <link rel="stylesheet" href="arranging-the-widths.css">
</head>
<body>
  <form>
    <fieldset>
      <legend>Rent Audi Vehicles</legend>

      <label for="name">Name</label>
      <input type="text" id="name" placeholder="Enter your name">

      <label for="model">Select</label>
      <select id="model">
        <option>Audi 80</option>
        <option>Audi 90</option>
        <option>Audi RS 6</option>
        <option>Audi S8</option>
      </select>

      <label for="message">Message:</label>
      <textarea id="message" rows="10"></textarea>
    </fieldset>
  </form>
</body>
</html>
