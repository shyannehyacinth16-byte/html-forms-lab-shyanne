<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login Form</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="image-container">
    <img src="images/image-photo.jpg" alt="Profile photo">
  </div>
  <main>
    <h1>Flat Business Profile Widget</h1>
    <form>
      <input type="text" name="username" placeholder="Name" class="user">
      <input type="password" name="password" placeholder="*******" class="pass">
      <input type="submit" value="Submit">
    </form>
  </main>
  <footer>
    <p>&copy; 2016 Flat Business Profile Widget. All rights reserved</p>
  </footer>
</body>
</html>
